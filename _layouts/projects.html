---
layout: archive
---

<div class="projects">
  {% for project in site.data.projects %}
  <article class="project-item">
    {% if project.image %}
    <div class="project-image">
      <img src="{{ project.image }}" alt="{{ project.title }}" loading="lazy">
    </div>
    {% endif %}

    <div class="project-body">
      <h2>{{ project.title }}</h2>
      <p>{{ project.description }}</p>

      <div class="project-links">
        {% if project.demo %}
        <a href="{{ project.demo }}" class="btn btn-demo" target="_blank" rel="noopener">Live Demo</a>
        {% endif %}
        {% if project.code %}
        <a href="{{ project.code }}" class="btn btn-code" target="_blank" rel="noopener">View Code</a>
        {% endif %}
        {% if project.video %}
        <a href="{{ project.video }}" class="btn btn-video" target="_blank" rel="noopener">Watch Video</a>
        {% endif %}
      </div>
    </div>
  </article>
  {% endfor %}
</div>

<style>
  .projects {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1.3em;
  }

  .project-item {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .project-item:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-lg);
  }

  .project-image {
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
  }

  .project-image img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
  }

  .project-item:hover .project-image img {
    transform: scale(1.04);
  }

  .project-body {
    display: flex;
    flex-direction: column;
    flex: 1;
    padding: 1.1em 1.3em 1.2em;
  }

  .project-body h2 {
    margin: 0 0 0.45em;
    padding: 0;
    border: 0;
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 1.25em;
  }

  .project-body p {
    flex: 1;
    color: var(--text-muted);
    font-size: 0.88em;
  }

  .project-links {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5em;
  }

  @media (max-width: 480px) {
    .projects {
      grid-template-columns: 1fr;
    }
  }
</style>
